# The project page used to be the legacy Pages source (branch main, folder
# /docs). Legacy Pages only accepts / or /docs — so the site is deployed from
# here instead, and the repository's Pages source must be set to
# "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - Documents/Site/**
      - .github/workflows/pages.yml
  release:
    types: [published, edited]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live site: let a running deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Refresh Pages from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main

  deploy:
    if: github.event_name != 'release' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Check out the shared depiction updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: owngoal-dev/owngoal-packages
          ref: 4dab9b352c6b3e94c7b5efa96bd60fa94e69225a
          path: .depiction-tools
          sparse-checkout: scripts/update-depiction-changelogs.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Fetch GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 .depiction-tools/scripts/update-depiction-changelogs.py --repository "$RELEASE_REPOSITORY" --depiction Documents/Site/depiction.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: Documents/Site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
